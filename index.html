<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LA CULEBRITA KAREN - Creado por Dani v1</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
            user-select: none;
        }
        body {
            background-color: #0d0e15;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }
        header {
            text-align: center;
            width: 100%;
            max-width: 360px;
        }
        h1 {
            margin: 0;
            font-size: 1.4rem;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
        }
        .author {
            font-size: 0.8rem;
            color: #ff007f;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            background: #1a1c29;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            border: 1px solid #333;
        }
        .stat-item span {
            color: #ffcc00;
            font-weight: bold;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 340px;
            aspect-ratio: 1;
            margin: 8px 0 12px 0;
        }
        canvas {
            background: #050508;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            border: 2px solid #222;
        }
        
        /* Área de Controles */
        .controls-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 340px;
            gap: 10px;
            margin-bottom: 25px; /* Eleva la botonera */
        }

        .btn-power {
            background: linear-gradient(135deg, #ff007f, #b30059);
            border: 2px solid #ff77bc;
            color: #fff;
            border-radius: 20px;
            font-weight: bold;
            padding: 10px 18px;
            font-size: 0.85rem;
            box-shadow: 0 4px 10px rgba(255, 0, 127, 0.4);
            transition: transform 0.1s;
        }
        .btn-power:active {
            transform: scale(0.95);
        }
        .btn-power:disabled {
            background: #333;
            border-color: #555;
            box-shadow: none;
            opacity: 0.5;
        }

        /* Joystick D-Pad Circular */
        .dpad {
            position: relative;
            width: 160px;
            height: 160px;
            background: #151824;
            border-radius: 50%;
            border: 3px solid #2a2e45;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(0, 0, 0, 0.8);
        }
        .dpad-btn {
            position: absolute;
            background: #222738;
            color: #00ffcc;
            border: 1px solid #3b425e;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.1);
        }
        .dpad-btn:active {
            background: #00ffcc;
            color: #121212;
        }
        .dpad-up {
            top: 8px;
            left: 55px;
            width: 50px;
            height: 45px;
            border-radius: 10px 10px 4px 4px;
        }
        .dpad-down {
            bottom: 8px;
            left: 55px;
            width: 50px;
            height: 45px;
            border-radius: 4px 4px 10px 10px;
        }
        .dpad-left {
            top: 55px;
            left: 8px;
            width: 45px;
            height: 50px;
            border-radius: 10px 4px 4px 10px;
        }
        .dpad-right {
            top: 55px;
            right: 8px;
            width: 45px;
            height: 50px;
            border-radius: 4px 10px 10px 4px;
        }
        .dpad-center {
            position: absolute;
            top: 55px;
            left: 55px;
            width: 50px;
            height: 50px;
            background: #1a1e2d;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>LA CULEBRITA KAREN</h1>
        <div class="author">Creado por Dani v1</div>
        <div class="stats">
            <div class="stat-item">Nivel: <span id="lvl">1</span></div>
            <div class="stat-item">Puntos: <span id="score">0</span></div>
            <div class="stat-item">Poder: <span id="power-status">LISTO</span></div>
        </div>
    </header>

    <div id="game-container">
        <canvas id="gameCanvas" width="300" height="300"></canvas>
    </div>

    <div class="controls-area">
        <button class="btn-power" id="powerBtn" onclick="activatePower()">✨ PORTAL FASE (3s)</button>
        
        <!-- Joystick D-Pad -->
        <div class="dpad">
            <div class="dpad-center"></div>
            <div class="dpad-btn dpad-up" onclick="setDir('UP')">▲</div>
            <div class="dpad-btn dpad-left" onclick="setDir('LEFT')">◀</div>
            <div class="dpad-btn dpad-right" onclick="setDir('RIGHT')">▶</div>
            <div class="dpad-btn dpad-down" onclick="setDir('DOWN')">▼</div>
        </div>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const GRID = 15;
    const TILE_SIZE = canvas.width / GRID;
    
    let snake = [{x: 7, y: 7}];
    let dir = 'RIGHT';
    let nextDir = 'RIGHT';
    let food = {};
    let blocks = [];
    let score = 0;
    let level = 1;
    let gameLoop;
    let speed = 260; // Velocidad inicial más lenta para arrancar pausado
    
    // Habilidad especial
    let powerActive = false;
    let powerCooldown = false;

    // Tipos de Comida Elementales
    const FOOD_TYPES = [
        { type: 'NORMAL', color: '#00ffcc', points: 10 },
        { type: 'FIRE', color: '#ff3300', points: 25 },
        { type: 'ICE', color: '#00ccff', points: 15 },
        { type: 'POISON', color: '#a000ff', points: 30 }
    ];

    function initGame() {
        snake = [{x: 7, y: 7}, {x: 6, y: 7}];
        dir = 'RIGHT';
        nextDir = 'RIGHT';
        score = 0;
        level = 1;
        speed = 260; 
        updateStats();
        generateObstacles();
        spawnFood();
        if(gameLoop) clearInterval(gameLoop);
        gameLoop = setInterval(draw, speed);
    }

    function generateObstacles() {
        blocks = [];
        const count = level * 2;
        for(let i=0; i < count; i++) {
            let bx, by;
            do {
                bx = Math.floor(Math.random() * GRID);
                by = Math.floor(Math.random() * GRID);
            } while((bx === 7 && by === 7) || blocks.some(b => b.x === bx && b.y === by));
            blocks.push({x: bx, y: by});
        }
    }

    function spawnFood() {
        let fx, fy;
        do {
            fx = Math.floor(Math.random() * GRID);
            fy = Math.floor(Math.random() * GRID);
        } while(
            snake.some(segment => segment.x === fx && segment.y === fy) ||
            blocks.some(b => b.x === fx && b.y === fy)
        );

        const randomType = FOOD_TYPES[Math.floor(Math.random() * FOOD_TYPES.length)];
        food = { x: fx, y: fy, ...randomType };
    }

    function setDir(newDir) {
        if (newDir === 'UP' && dir !== 'DOWN') nextDir = 'UP';
        if (newDir === 'DOWN' && dir !== 'UP') nextDir = 'DOWN';
        if (newDir === 'LEFT' && dir !== 'RIGHT') nextDir = 'LEFT';
        if (newDir === 'RIGHT' && dir !== 'LEFT') nextDir = 'RIGHT';
    }

    function activatePower() {
        if(powerCooldown || powerActive) return;
        
        powerActive = true;
        document.getElementById('power-status').innerText = "ACTIVO";
        document.getElementById('power-status').style.color = "#ff007f";
        document.getElementById('powerBtn').disabled = true;

        setTimeout(() => {
            powerActive = false;
            powerCooldown = true;
            document.getElementById('power-status').innerText = "RECARGANDO";
            document.getElementById('power-status').style.color = "#ff9900";
            
            setTimeout(() => {
                powerCooldown = false;
                document.getElementById('power-status').innerText = "LISTO";
                document.getElementById('power-status').style.color = "#00ffcc";
                document.getElementById('powerBtn').disabled = false;
            }, 5000);
        }, 3000);
    }

    function draw() {
        dir = nextDir;
        let headX = snake[0].x;
        let headY = snake[0].y;

        if (dir === 'UP') headY--;
        if (dir === 'DOWN') headY++;
        if (dir === 'LEFT') headX--;
        if (dir === 'RIGHT') headX++;

        if (powerActive) {
            if (headX < 0) headX = GRID - 1;
            if (headX >= GRID) headX = 0;
            if (headY < 0) headY = GRID - 1;
            if (headY >= GRID) headY = 0;
        } else {
            if (headX < 0 || headX >= GRID || headY < 0 || headY >= GRID) {
                return gameOver();
            }
        }

        if (!powerActive && blocks.some(b => b.x === headX && b.y === headY)) {
            return gameOver();
        }

        if (!powerActive && snake.some(s => s.x === headX && s.y === headY)) {
            return gameOver();
        }

        const newHead = {x: headX, y: headY};
        snake.unshift(newHead);

        if (headX === food.x && headY === food.y) {
            score += food.points;
            
            if (food.type === 'FIRE') {
                blocks = blocks.filter(b => Math.hypot(b.x - headX, b.y - headY) > 2);
            }

            // Aumento Progresivo de Nivel y Velocidad
            if (Math.floor(score / 40) + 1 > level) {
                level++;
                speed = Math.max(70, speed - 25); // Incrementa la velocidad (reduce milisegundos)
                clearInterval(gameLoop);
                gameLoop = setInterval(draw, speed);
                generateObstacles();
            }

            updateStats();
            spawnFood();
        } else {
            snake.pop();
        }

        ctx.fillStyle = "#050508";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ff0055";
        blocks.forEach(b => {
            ctx.shadowBlur = 8;
            ctx.shadowColor = "#ff0055";
            ctx.fillRect(b.x * TILE_SIZE, b.y * TILE_SIZE, TILE_SIZE - 2, TILE_SIZE - 2);
        });

        ctx.fillStyle = food.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = food.color;
        ctx.beginPath();
        ctx.arc((food.x + 0.5) * TILE_SIZE, (food.y + 0.5) * TILE_SIZE, TILE_SIZE / 2.5, 0, Math.PI * 2);
        ctx.fill();

        snake.forEach((part, index) => {
            ctx.fillStyle = powerActive ? '#ff007f' : (index === 0 ? '#ffffff' : '#00ffcc');
            ctx.shadowBlur = powerActive ? 15 : 10;
            ctx.shadowColor = powerActive ? '#ff007f' : '#00ffcc';
            ctx.fillRect(part.x * TILE_SIZE, part.y * TILE_SIZE, TILE_SIZE - 2, TILE_SIZE - 2);
        });

        ctx.shadowBlur = 0;
    }

    function updateStats() {
        document.getElementById('score').innerText = score;
        document.getElementById('lvl').innerText = level;
    }

    function gameOver() {
        clearInterval(gameLoop);
        alert(`¡Juego Terminado! \nScore: ${score}\nNivel Alcanzado: ${level}`);
        initGame();
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowUp') setDir('UP');
        if (e.key === 'ArrowDown') setDir('DOWN');
        if (e.key === 'ArrowLeft') setDir('LEFT');
        if (e.key === 'ArrowRight') setDir('RIGHT');
        if (e.key === ' ') activatePower();
    });

    initGame();
</script>
</body>
</html>
